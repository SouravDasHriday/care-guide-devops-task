services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: care-guide-devops-app:latest
    container_name: devops_web_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
