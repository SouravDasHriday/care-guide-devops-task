<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gradCI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gradHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gradVPS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="320" rx="16" fill="#0f172a"/>

  <!-- Step 1: Code Commit -->
  <g transform="translate(40, 50)" filter="url(#shadow)">
    <rect width="180" height="200" rx="12" fill="url(#gradDev)" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">1. CODE COMMIT</text>
    <rect x="20" y="55" width="140" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="80" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12">Local Dev / Git</text>
    <rect x="20" y="110" width="140" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="135" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="12">git push origin main</text>
    <text x="90" y="155" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">GitHub Repository</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 230 150 L 270 150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: GitHub Actions CI -->
  <g transform="translate(280, 50)" filter="url(#shadow)">
    <rect width="200" height="200" rx="12" fill="url(#gradCI)" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">2. GITHUB ACTIONS CI</text>
    <rect x="20" y="55" width="160" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="76" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11">flake8 Lint Check</text>
    <rect x="20" y="95" width="160" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="116" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11">pytest Unit Tests</text>
    <rect x="20" y="135" width="160" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="155" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-weight="600" font-size="11">Docker Buildx</text>
    <text x="100" y="172" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Multi-stage Container</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 490 150 L 530 150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Docker Hub -->
  <g transform="translate(540, 50)" filter="url(#shadow)">
    <rect width="180" height="200" rx="12" fill="url(#gradHub)" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">3. DOCKER HUB</text>
    <rect x="20" y="60" width="140" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="85" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="12">Public Registry</text>
    <text x="90" y="100" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">tag: latest &amp; sha</text>
    <rect x="20" y="125" width="140" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="148" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11">Automated Push</text>
    <text x="90" y="165" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">via GitHub Secrets</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 730 150 L 770 150" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: VPS / EC2 Deployment -->
  <g transform="translate(780, 50)" filter="url(#shadow)">
    <rect width="180" height="200" rx="12" fill="url(#gradVPS)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">4. VPS / AWS EC2</text>
    <rect x="20" y="60" width="140" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="83" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-weight="600" font-size="11">docker pull</text>
    <text x="90" y="100" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">docker-compose up -d</text>
    <rect x="20" y="125" width="140" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="148" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="12">Port 8080 : 8080</text>
    <text x="90" y="165" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="10">status: running (200 OK)</text>
  </g>
</svg>
